<div class="page-title-box">
    <h2>Data Master Pelanggan</h2>
    <p>Kelola dan daftarkan pelanggan baru ke dalam sistem.</p>
</div>

<div class="table-card">
    <div class="table-card-header">
        <h3>Tambah Pelanggan Baru</h3>
    </div>

    <!-- Alert Notifikasi -->
    <div id="form-alert" style="display: none; margin-bottom: 20px; padding: 12px 16px; border-radius: 6px; font-size: 13px;"></div>

    <form id="form-pelanggan" novalidate>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-bottom: 20px;">
            
            <!-- Input Nama -->
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 13px; font-weight: 600; color: #475569;">Nama Lengkap <span style="color: #ef4444;">*</span></label>
                <input type="text" id="nama_pelanggan" name="nama_pelanggan" class="form-control" placeholder="Masukkan nama pelanggan" style="padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none;">
                <small class="error-msg" id="err-nama" style="color: #ef4444; font-size: 12px; margin-top: 2px;"></small>
            </div>

            <!-- Input No HP -->
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 13px; font-weight: 600; color: #475569;">No. WhatsApp / HP <span style="color: #ef4444;">*</span></label>
                <input type="text" id="no_hp" name="no_hp" class="form-control" placeholder="Contoh: 081234567890" style="padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none;">
                <small class="error-msg" id="err-hp" style="color: #ef4444; font-size: 12px; margin-top: 2px;"></small>
            </div>

            <!-- Input Alamat Singkat -->
            <div style="display: flex; flex-direction: column; gap: 6px;">
                <label style="font-size: 13px; font-weight: 600; color: #475569;">Alamat Singkat</label>
                <input type="text" id="alamat" name="alamat" class="form-control" placeholder="Masukkan alamat pelanggan" style="padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; outline: none;">
            </div>

        </div>

        <div style="display: flex; gap: 10px; border-top: 1px solid #f1f5f9; padding-top: 16px;">
            <button type="submit" id="btn-simpan-pelanggan" style="background: #2563eb; color: #ffffff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer;">
                Simpan Data
            </button>
            <button type="reset" id="btn-reset-form" style="background: #64748b; color: #ffffff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer;">
                Reset
            </button>
        </div>
    </form>
</div>

<script src="js/validasi.js"></script>
